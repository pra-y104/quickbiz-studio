# Cloudflare Worker configuration for the QuickBiz Studio API.
# Secrets (Supabase service role key, AI keys) must NEVER be written here.
# Set them with: wrangler secret put <NAME>
name = "quickbiz-studio-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Non-secret defaults for local development. Production values are set in the
# Cloudflare dashboard per environment so this file stays safe to commit.
[vars]
ENVIRONMENT = "development"
APP_VERSION = "0.1.0"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_MAX_REQUESTS = "120"

[observability]
enabled = true

[env.preview.vars]
ENVIRONMENT = "preview"
APP_VERSION = "0.1.0"
# Preview branches are served from per-branch *.pages.dev URLs; allow the
# production Pages origin plus localhost for local preview.
ALLOWED_ORIGINS = "https://quickbiz-studio.pages.dev,http://localhost:5173,http://127.0.0.1:5173"
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_MAX_REQUESTS = "60"

# Pin the production Worker name so the workers.dev URL is stable
# (https://quickbiz-studio-api.<subdomain>.workers.dev) regardless of the
# environment suffix Wrangler would otherwise append.
[env.production]
name = "quickbiz-studio-api"

[env.production.vars]
ENVIRONMENT = "production"
APP_VERSION = "0.1.0"
# The real frontend origin. Add a custom domain here later if one is attached.
ALLOWED_ORIGINS = "https://quickbiz-studio.pages.dev"
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_MAX_REQUESTS = "120"
